<!DOCTYPE html>
<html lang="am" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>የአስተዳዳሪ መግቢያ - የወልድያ ከተማ አስተዳደር</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }</style>
</head>
<body class="h-full bg-slate-950 flex items-center justify-center px-4">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8 space-y-6">
    <!-- Header Logo / Title -->
    <div class="text-center space-y-2">
      <div class="inline-flex p-3 bg-teal-950 border border-amber-400 rounded-full shadow-lg mb-2">
        <i class="fa-solid fa-user-shield text-2xl text-amber-400"></i>
      </div>
      <h2 class="text-2xl font-black text-white">Admin Login</h2>
      <p class="text-xs text-emerald-400 font-semibold">የወልድያ ከተማ አስተዳደር ፖርታል</p>
    </div>

    <!-- Login Form -->
    <form id="adminLoginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold mb-1 text-gray-300">ኢሜይል አድራሻ (Email)</label>
        <input type="email" id="adminEmail" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white text-sm focus:outline-none focus:border-amber-400" placeholder="admin@woldiacityadmin.gov.et">
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1 text-gray-300">የይለፍ ቃል (Password)</label>
        <input type="password" id="adminPassword" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white text-sm focus:outline-none focus:border-amber-400" placeholder="••••••••">
      </div>
      <button type="submit" class="w-full bg-amber-500 text-slate-950 font-extrabold py-3 rounded-lg hover:bg-amber-400 transition shadow-lg text-sm">
        ግባ (Login)
      </button>
    </form>

    <div id="loginError" class="text-center text-xs text-red-400 font-bold hidden"></div>

    <div class="text-center pt-2 border-t border-slate-800">
      <a href="index.html" class="text-xs text-gray-400 hover:text-amber-400 transition">&larr; ወደ ዋናው ዌብሳይት ተመለስ</a>
    </div>
  </div>

  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('adminEmail.value');
      // Simple mock validation (ወደፊት ከባክኤንድ ጋር ይያያዛል)
      window.location.href = 'admin.html';
    });
  </script>
</body>
</html>
